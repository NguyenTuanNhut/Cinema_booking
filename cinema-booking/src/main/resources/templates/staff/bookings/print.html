<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>In vé</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body class="container mt-4">
    <div class="card">
        <div class="card-body">
            <h3 class="card-title">Vé xem phim</h3>
            <p>Mã đơn: <strong th:text="${booking.bookingCode}"></strong></p>
            <p>Phim: <strong th:text="${booking.showtime.movie.title}"></strong></p>
            <p>Suất: <strong th:text="${#temporals.format(booking.showtime.startTime,'dd-MM-yyyy HH:mm')}"></strong></p>
            <p>Phòng: <strong th:text="${booking.showtime.room.name}"></strong></p>
            <p>Ghế:
                <span th:each="t : ${booking.tickets}" th:text="${t.seat.seatNumber} + ' '"></span>
            </p>
            <p>Tổng tiền: <strong th:text="${#numbers.formatDecimal(booking.totalPrice,0,'COMMA',0,'POINT')} + ' VNĐ'"></strong></p>

            <div th:if="${booking.confirmedBy != null}">
                <p>Xác nhận bởi: <strong th:text="${booking.confirmedBy.email}"></strong></p>
                <p>Thời gian xác nhận: <strong th:text="${#temporals.format(booking.confirmedAt,'dd-MM-yyyy HH:mm')}"></strong></p>
            </div>

            <div class="mt-3 no-print">
                <button class="btn btn-primary" onclick="window.print()">In</button>
                <a href="/staff/bookings" class="btn btn-secondary">Quay lại</a>
            </div>
        </div>
    </div>
</body>
</html>
