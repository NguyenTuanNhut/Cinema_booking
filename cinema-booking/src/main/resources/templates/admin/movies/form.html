<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thông tin phim</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 th:text="${movie.id == null ? 'Thêm phim mới' : 'Sửa phim'}"></h2>

    <form th:action="@{/admin/movies/save}" th:object="${movie}" method="post" class="mt-4">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Tiêu đề</label>
            <input type="text" th:field="*{title}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Thể loại</label>
            <select th:field="*{genre.id}" class="form-select">
                <option th:each="g : ${genres}" th:value="${g.id}" th:text="${g.name}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Thời lượng (phút)</label>
            <input type="number" th:field="*{duration}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Poster URL</label>
            <input type="text" th:field="*{poster}" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Lưu phim</button>
        <a href="/admin/movies" class="btn btn-secondary">Hủy</a>
    </form>
</body>
</html>
