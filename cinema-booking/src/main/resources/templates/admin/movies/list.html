<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý phim</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between mb-4">
        <h2>Danh sách phim (Admin)</h2>
        <a href="/admin/movies/create" class="btn btn-success">Thêm phim mới</a>
    </div>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tiêu đề</th>
                <th>Thể loại</th>
                <th>Thời lượng</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="m : ${movies}">
                <td th:text="${m.id}"></td>
                <td th:text="${m.title}"></td>
                <td th:text="${m.genre != null ? m.genre.name : ''}"></td>
                <td th:text="${m.duration} + ' phút'"></td>
                <td>
                    <a th:href="@{'/admin/movies/edit/' + ${m.id}}" class="btn btn-sm btn-primary">Sửa</a>
                    <a th:href="@{'/admin/movies/delete/' + ${m.id}}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Xóa phim này?')">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>
    <a href="/movies" class="btn btn-secondary">Quay lại trang khách</a>
</body>
</html>
