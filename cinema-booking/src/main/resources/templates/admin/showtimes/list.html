<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý suất chiếu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between mb-4">
        <h2>Danh sách suất chiếu</h2>
        <a href="/admin/showtimes/create" class="btn btn-success">Thêm suất chiếu mới</a>
    </div>

    <table class="table table-bordered shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Phim</th>
                <th>Phòng</th>
                <th>Bắt đầu</th>
                <th>Kết thúc (gồm 15p dọn)</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="st : ${showtimes}">
                <td th:text="${st.movie.title}"></td>
                <td th:text="${st.room.name}"></td>
                <td th:text="${#temporals.format(st.startTime, 'dd-MM-yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(st.endTime, 'dd-MM-yyyy HH:mm')}"></td>
            </tr>
        </tbody>
    </table>
    <a href="/movies" class="btn btn-secondary">Quay lại trang chủ</a>
</body>
</html>
