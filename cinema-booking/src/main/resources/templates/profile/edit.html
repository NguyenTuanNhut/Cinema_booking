<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chỉnh sửa hồ sơ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 px-3 rounded">
        <a class="navbar-brand" href="/">Cinema Booking</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/movies">Trang chủ</a>
            <a class="nav-link text-white" href="/profile">Hồ sơ</a>
            <a class="nav-link text-white" href="/bookings/history">Lịch sử vé</a>
            <form action="/logout" method="POST" class="d-inline ms-3">
                <button type="submit" class="btn btn-sm btn-danger">Đăng xuất</button>
            </form>
        </div>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Chỉnh sửa thông tin cá nhân</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/profile/edit}" th:object="${profileDto}" method="POST">
                        <!-- Họ và tên -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Họ và tên</label>
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}" placeholder="Nhập họ và tên">
                        </div>

                        <!-- Email (read-only) -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" th:value="${profile.user.email}" disabled>
                        </div>

                        <!-- Số điện thoại -->
                        <div class="mb-3">
                            <label for="phone" class="form-label">Số điện thoại</label>
                            <input type="tel" class="form-control" id="phone" th:field="*{phone}" placeholder="Nhập số điện thoại">
                        </div>

                        <!-- Địa chỉ -->
                        <div class="mb-3">
                            <label for="address" class="form-label">Địa chỉ</label>
                            <input type="text" class="form-control" id="address" th:field="*{address}" placeholder="Nhập địa chỉ">
                        </div>

                        <!-- Ngày sinh -->
                        <div class="mb-3">
                            <label for="birthday" class="form-label">Ngày sinh</label>
                            <input type="date" class="form-control" id="birthday" th:field="*{birthday}">
                        </div>

                        <!-- Avatar URL -->
                        <div class="mb-3">
                            <label for="avatar" class="form-label">URL ảnh đại diện</label>
                            <input type="url" class="form-control" id="avatar" th:field="*{avatar}"
                                   placeholder="https://example.com/avatar.jpg">
                            <small class="text-muted">Nhập URL của ảnh đại diện (hình jpg, png, ...)</small>
                        </div>

                        <!-- Preview avatar -->
                        <div class="mb-3 text-center">
                            <label class="form-label">Xem trước ảnh đại diện</label>
                            <div>
                                <img id="avatarPreview"
                                     th:src="${profileDto.avatar != null && !profileDto.avatar.isEmpty() ? profileDto.avatar : (profile.avatar != null && !profile.avatar.isEmpty() ? profile.avatar : 'https://www.w3schools.com/howto/img_avatar.png')}"
                                     class="rounded-circle border shadow-sm" width="150" height="150" style="object-fit: cover;" alt="Avatar Preview">
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                            <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                            <a href="/profile" class="btn btn-outline-secondary">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript để cập nhật preview ảnh -->
    <script>
        document.getElementById('avatar').addEventListener('change', function(e) {
            const url = e.target.value;
            if (url) {
                document.getElementById('avatarPreview').src = url;
            } else {
                document.getElementById('avatarPreview').src = 'https://www.w3schools.com/howto/img_avatar.png';
            }
        });
    </script>
</body>
</html>
