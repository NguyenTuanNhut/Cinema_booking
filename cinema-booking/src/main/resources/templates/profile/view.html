<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hồ sơ cá nhân</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 px-3 rounded">
        <a class="navbar-brand" href="/">Cinema Booking</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/movies">Trang chủ</a>
            <a class="nav-link text-white" href="/profile">Hồ sơ</a>
            <a class="nav-link text-white" href="/bookings/history">Lịch sử vé</a>
        </div>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Thông tin cá nhân</h3>
                </div>
                <div class="card-body text-center">
                    <img th:src="${profile.avatar != null && !profile.avatar.isEmpty() ? profile.avatar : 'https://www.w3schools.com/howto/img_avatar.png'}"
                         class="rounded-circle mb-3 border shadow-sm" width="150" height="150" style="object-fit: cover;" alt="Avatar">

                    <div th:if="${param.success}" class="alert alert-success py-1 small">Cập nhật hồ sơ thành công!</div>

                    <table class="table table-borderless text-start mt-3">
                        <tr>
                            <th width="40%">Họ và tên:</th>
                            <td th:text="${profile.fullName}"></td>
                        </tr>
                        <tr>
                            <th>Email:</th>
                            <td th:text="${profile.user.email}"></td>
                        </tr>
                        <tr>
                            <th>Số điện thoại:</th>
                            <td th:text="${profile.phone}"></td>
                        </tr>
                        <tr>
                            <th>Địa chỉ:</th>
                            <td th:text="${profile.address}"></td>
                        </tr>
                        <tr>
                            <th>Ngày sinh:</th>
                            <td th:text="${profile.birthday != null ? #temporals.format(profile.birthday, 'dd/MM/yyyy') : 'Chưa cập nhật'}"></td>
                        </tr>
                    </table>

                    <div class="mt-4">
                        <a href="/profile/edit" class="btn btn-warning px-4">Chỉnh sửa hồ sơ</a>
                        <a href="/movies" class="btn btn-outline-secondary px-4">Quay lại</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
