<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Danh sách phim</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .movie-card img { height: 400px; object-fit: cover; }
        .nav-link { cursor: pointer; }
    </style>
</head>
<body class="container mt-5">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 px-3 rounded">
        <a class="navbar-brand" href="/">Cinema Booking</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/movies">Trang chủ</a>
                </li>

                <!-- Kiểm tra quyền ADMIN bằng cả 2 cách để đảm bảo hiển thị -->
                <li class="nav-item dropdown" sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ADMIN')">
                    <a class="nav-link dropdown-toggle text-warning font-weight-bold" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        QUẢN LÝ
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="adminDropdown">
                        <li><a class="dropdown-item" href="/admin/movies">Quản lý Phim</a></li>
                        <li><a class="dropdown-item" href="/admin/showtimes">Quản lý Suất chiếu</a></li>
                    </ul>
                </li>

                <!-- Menu cho STAFF -->
                <li class="nav-item dropdown" sec:authorize="hasAnyAuthority('ROLE_STAFF', 'STAFF')">
                    <a class="nav-link dropdown-toggle text-success font-weight-bold" href="#" id="staffDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                         NHÂN VIÊN
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="staffDropdown">
                        <li><a class="dropdown-item" href="/staff/pending-bookings">📋 Đơn Chờ Xác Nhận</a></li>
                        <li><a class="dropdown-item" href="/staff/bookings">🔍 Tìm Kiếm & Xác Nhận</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/staff">🏠 Dashboard Nhân Viên</a></li>
                    </ul>
                </li>
            </ul>

            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" sec:authorize="isAuthenticated()">
                    Chào: <strong sec:authentication="name" class="text-white"></strong>
                    (<span class="small text-info" sec:authentication="principal.authorities"></span>)
                </span>
                <a class="nav-link" href="/profile">Hồ sơ</a>
                <a class="nav-link" href="/bookings/history">Lịch sử vé</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm ms-2">Đăng xuất</button>
                </form>
            </div>
        </div>
    </nav>



    <h2 class="mb-4 text-center text-primary">Phim Đang Chiếu</h2>
    <div class="row">
        <div class="col-md-4 mb-4" th:each="movie : ${movies}">
            <div class="card movie-card shadow-sm h-100">
                <img th:src="${movie.poster}" class="card-img-top" alt="Poster">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-truncate" th:text="${movie.title}"></h5>
                    <p class="card-text text-muted">Thể loại: <span th:text="${movie.genre != null ? movie.genre.name : 'Chưa phân loại'}"></span></p>
                    <p class="card-text">Thời lượng: <span th:text="${movie.duration}"></span> phút</p>
                    <a th:href="@{'/movies/' + ${movie.id}}" class="btn btn-primary mt-auto w-100">Chi tiết & Đặt vé</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Bootstrap 5 bắt buộc để chạy menu thả xuống -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
