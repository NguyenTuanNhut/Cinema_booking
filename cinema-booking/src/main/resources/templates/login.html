<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Đăng nhập</h3>

                        <!-- Thông báo lỗi khi đăng nhập sai -->
                        <div th:if="${param.error}" class="alert alert-danger">
                            Email hoặc mật khẩu không chính xác!
                        </div>
                        <div th:if="${param.logout}" class="alert alert-info">
                            Bạn đã đăng xuất thành công.
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <!-- Tên name="email" phải khớp với usernameParameter trong SecurityConfig -->
                                <input type="email" name="email" class="form-control" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mật khẩu</label>
                                <!-- Tên name="password" phải khớp với passwordParameter trong SecurityConfig -->
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
                        </form>


                        <div class="text-center mt-2">
                            Chưa có tài khoản? <a href="/auth/register">Đăng ký ngay</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
