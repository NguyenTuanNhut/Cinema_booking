<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lịch sử đặt vé</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Lịch sử đặt vé của bạn</h2>

    <div th:if="${param.success}" class="alert alert-success">Đặt vé thành công!</div>
    <div th:if="${param.cancelled}" class="alert alert-warning">Đã hủy vé thành công.</div>

    <table class="table table-striped mt-4">
        <thead>
            <tr>
                <th>Mã vé</th>
                <th>Phim</th>
                <th>Suất chiếu</th>
                <th>Phòng</th>
                <th>Ghế</th>
                <th>Tổng tiền</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="b : ${history}">
                <td th:text="${b.bookingCode}"></td>
                <td th:text="${b.movieTitle}"></td>
                <td th:text="${#temporals.format(b.startTime, 'dd-MM-yyyy HH:mm')}"></td>
                <td th:text="${b.roomName}"></td>
                <td th:text="${#strings.listJoin(b.seats, ', ')}"></td>
                <td th:text="${#numbers.formatDecimal(b.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                <td>
                    <span th:class="${b.status == 'CONFIRMED' ? 'badge bg-success' : 'badge bg-danger'}"
                          th:text="${b.status}"></span>
                </td>
                <td>
                    <form th:if="${b.status == 'CONFIRMED'}"
                          th:action="@{'/bookings/cancel/' + ${b.bookingId}}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Bạn có chắc muốn hủy vé?')">Hủy vé</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <a href="/movies" class="btn btn-secondary">Quay lại danh sách phim</a>
</body>
</html>
